---
layout: default
---
<article class="sketch">
  <header class="post-header">
    <h1 class="sketch-title">{{ page.title | escape }}</h1>
  </header>

  {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="sketch-image">
  {% endif %}

  <div class="sketch-content">
    {{ content }}
  </div>

  {% include prev-next.html collection=page.collection %}
</article>
